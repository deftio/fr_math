name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc  # Use default clang on macOS

    steps:
    - uses: actions/checkout@v4

    - name: Set up compiler
      run: |
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV
        else
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV
        fi

    - name: Build library
      run: make lib

    - name: Build examples
      run: make examples

    - name: Run tests
      run: make test

    - name: Generate size report
      run: |
        echo "## Build Size Report (${{ matrix.os }} - ${{ matrix.compiler }})" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        size build/*.o 2>/dev/null | head -5 >> $GITHUB_STEP_SUMMARY || echo "Size command not available" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

    - name: Generate coverage report
      if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
      run: |
        make coverage
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        # Our coverage script uses gcov directly and outputs to console
        # Capture the last part of the output for the summary
        make coverage 2>&1 | tail -20 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: arm-linux-gnueabihf
            arch: ARM
          - target: riscv64-linux-gnu
            arch: RISC-V

    steps:
    - uses: actions/checkout@v4

    - name: Install cross-compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-${{ matrix.target }} g++-${{ matrix.target }}

    - name: Cross-compile
      run: |
        export CC=${{ matrix.target }}-gcc
        export CXX=${{ matrix.target }}-g++
        make lib

    - name: Generate cross-compile size report
      run: |
        echo "## Cross-Compile Size Report (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ${{ matrix.target }}-size build/*.o | head -5 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Detailed sizes:" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        ls -lh build/*.o >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  # 16-bit int: on AVR (Arduino Uno/Nano), MSP430 and 68HC11 a plain int
  # is 16 bits, so a constant like `1 << 15` or `1u << 30` overflows
  # unless it is cast to s32/u32 first (2.0.11 shipped such bugs in
  # FR_log2 and FR_LOG2MIN). There is no AVR runtime here, so this job
  # compiles every build variant with avr-gcc and fails on any shift or
  # overflow warning.
  avr-16bit-int:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Install avr-gcc
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-avr avr-libc

    - name: Compile for ATmega328P and check shift warnings
      run: |
        EXTRA=""
        if echo 'int x;' | avr-gcc -Wshift-overflow=2 -x c -c -o /dev/null - 2>/dev/null; then
          EXTRA="-Wshift-overflow=2"
        fi
        status=0
        for defs in "" "-DFR_CORE_ONLY" "-DFR_LEAN -DFR_NO_PRINT" "-DFR_NO_STDINT"; do
          echo "== avr-gcc $defs"
          out=$(avr-gcc -mmcu=atmega328p -Os -Wall $EXTRA $defs -Isrc \
                -c src/FR_math.c -o build-avr.o 2>&1) || status=1
          echo "$out"
          if echo "$out" | grep -E "shift|overflow"; then status=1; fi
          avr-size build-avr.o || true
        done
        exit $status

  test-32bit:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install 32-bit support
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib

    - name: Build and test 32-bit
      run: |
        export CFLAGS="-m32"
        export CXXFLAGS="-m32"
        make clean
        make test

    - name: Generate 32-bit size report
      run: |
        echo "## 32-bit Build Size Report" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        size build/*.o | head -5 >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  overflow-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Full test suite under AddressSanitizer + UndefinedBehaviorSanitizer.
    # Any report fails the job (-fno-sanitize-recover=all). Notes:
    #  - clang: the old -fsanitize=integer flag is clang-only.
    #  - -fsanitize=integer is not used: it flags unsigned wraparound, which
    #    the library relies on (BAM phase accumulators wrap at 65536).
    #  - shift-base is off: the library deliberately left-shifts negative
    #    values (arithmetic shift on every supported compiler). All other
    #    UB checks (signed overflow, bounds, shift exponent, divide by
    #    zero, ...) are on. Shift overflow is checked by the next step.
    - name: Build and test with sanitizers
      env:
        CC: clang
        CXX: clang++
        CFLAGS: -fsanitize=address,undefined -fno-sanitize=shift-base -fno-sanitize-recover=all -g
        CXXFLAGS: -fsanitize=address,undefined -fno-sanitize=shift-base -fno-sanitize-recover=all -g
      run: |
        make clean
        make test

    # Shift overflow: every suite rebuilt with -fsanitize=shift and the
    # handler in tests/ubsan_shift_check.c, which accepts in-range shifts
    # of negative values and aborts on any shift that overflows (see the
    # makefile's test-shift target).
    - name: Build and test with the shift-overflow checker
      run: make test-shift
